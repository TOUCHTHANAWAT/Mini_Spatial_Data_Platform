services:

  mongodb:
    image: mongo:8
    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend

    container_name: backend

    ports:
      - "8080:8080"

    env_file:
      - ./backend/.env

    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080

    container_name: frontend

    ports:
      - "4173:4173"

    env_file:
      - ./frontend/.env

    depends_on:
      - backend

volumes:
  mongodb_data: