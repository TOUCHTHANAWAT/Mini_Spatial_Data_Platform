name: CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend
        run: |
          docker build \
          -t thanawatkonkham/backend:latest \
          -t thanawatkonkham/backend:${{ github.sha }} \
          ./backend

      - name: Push Backend
        # run: docker push thanawatkonkham/backend:latest
        run: |
          docker push thanawatkonkham/backend:latest
          docker push thanawatkonkham/backend:${{ github.sha }}

      - name: Build Frontend
        run: |
          docker build \
          --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
          -t thanawatkonkham/frontend:latest \
          -t thanawatkonkham/frontend:${{ github.sha }} \
          ./frontend

      - name: Push Frontend
        # run: docker push thanawatkonkham/frontend:latest
        run: |
          docker push yourname/frontend:latest
          docker push yourname/frontend:${{ github.sha }}